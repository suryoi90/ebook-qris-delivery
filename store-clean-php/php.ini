upload_max_filesize = 80M
post_max_size = 80M
memory_limit = 256M
max_execution_time = 600
max_input_time = 600
expose_php = Off
display_errors = Off

; Mitigation against CVE-2026-109618 & CVE-2026-109619 (PHP2Shell)
max_input_vars = 1000
max_input_nesting_level = 64
max_file_uploads = 5
disable_functions = system, passthru, proc_open, popen, pcntl_exec, dl, show_source, symlink
